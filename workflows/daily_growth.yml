name: Autonomous Daily Growth Pipeline

on:
  schedule:
    # Runs daily at 03:00 AM UTC (09:00 AM BD Time / Asia/Dhaka)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      auto_approve:
        description: 'Auto-approve and publish directly'
        required: false
        default: 'true'
        type: boolean
      day_number:
        description: 'Challenge Day Number (e.g. 14)'
        required: false
        default: '14'

jobs:
  growth-orchestration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Agent Growth Pipeline
        env:
          MOCK_MODE: ${{ secrets.MOCK_MODE || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TIMEZONE: "Asia/Dhaka"
          PUBLISH_WINDOW_START: "08:30"
          PUBLISH_WINDOW_END: "11:30"
          FIRST_COMMENT_DELAY_SECONDS: "120"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.day_number }}" ]; then
            python main.py --cli --auto-approve --day "${{ github.event.inputs.day_number }}"
          else
            python main.py --cli --auto-approve
          fi

      - name: Upload Carousel Assets (PDF & PNGs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-carousel-assets
          path: |
            output/
            data/growth.db
          retention-days: 14
